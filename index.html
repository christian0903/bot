<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Back on Track</title>
    <meta name="description" content="Back on Track - Votre studio de fitness" />
    <meta name="theme-color" content="#a3e635" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

    <!-- iOS : Safari ignore le manifest pour l'icone et le plein ecran, il lui
         faut ces balises. L'apple-touch-icon pointait vers un PNG absent, et le
         .htaccess renvoyait index.html a sa place : iOS recevait du HTML au
         lieu d'une image et posait une icone generique sur l'ecran d'accueil. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Back on Track" />

    <!-- Umami Analytics (RGPD-compliant, no cookies) -->
    <!-- Remplacer data-website-id par votre ID Umami -->
    <!-- <script defer src="https://your-umami-instance.com/script.js" data-website-id="YOUR-WEBSITE-ID"></script> -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {})
        })
      }
    </script>
  </body>
</html>
